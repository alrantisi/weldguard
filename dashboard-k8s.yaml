apiVersion: apps/v1
kind: Deployment
metadata:
  name: weldguard-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weldguard-dashboard
  template:
    metadata:
      labels:
        app: weldguard-dashboard
    spec:
      containers:
      - name: weldguard-dashboard
        image: docker.io/library/weldguard-dashboard:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: weldguard-dashboard-svc
spec:
  type: NodePort
  selector:
    app: weldguard-dashboard
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30801
